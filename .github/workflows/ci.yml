name: Docker Image CI

on:
  push:
    branches: [ "solution" ]
  pull_request:
    branches: [ "solution" ]

jobs:

  build:

    runs-on: self-hosted

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file ./gist-server/Dockerfile --tag gist-server:${{ github.sha }}